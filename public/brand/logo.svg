<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logomark on Left -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="80" height="80" rx="22" fill="#0A0A16" stroke="url(#logo-grad)" stroke-width="2" />
    <!-- Node connections -->
    <circle cx="40" cy="18" r="4" fill="#00F0FF" filter="url(#logo-glow)" />
    <circle cx="62" cy="30" r="3.5" fill="#8B5CF6" />
    <circle cx="62" cy="56" r="3.5" fill="#EC4899" />
    <circle cx="40" cy="68" r="4" fill="#00F0FF" filter="url(#logo-glow)" />
    <circle cx="18" cy="56" r="3.5" fill="#8B5CF6" />
    <circle cx="18" cy="30" r="3.5" fill="#EC4899" />
    
    <path d="M40 18 L62 30 L62 56 L40 68 L18 56 L18 30 Z" stroke="url(#logo-grad)" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.5" />
    <path d="M40 18 L40 43 M62 30 L40 43 M62 56 L40 43 M40 68 L40 43 M18 56 L40 43 M18 30 L40 43" stroke="url(#logo-grad)" stroke-width="1.8" />
    <circle cx="40" cy="43" r="9" fill="#0A0A16" stroke="#00F0FF" stroke-width="2" />
    <path d="M40 35 C40 40 40 40 45 43 C40 46 40 46 40 51 C40 46 40 46 35 43 C40 40 40 40 40 35 Z" fill="url(#logo-grad)" />
  </g>

  <!-- Typography -->
  <g transform="translate(105, 0)">
    <text x="0" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#FFFFFF">LLM</tspan>
      <tspan fill="url(#logo-grad)"> For Everyone</tspan>
    </text>
    
    <rect x="0" y="58" width="170" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.06" stroke="url(#accent-grad)" stroke-width="0.8" />
    <text x="85" y="70" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#00F0FF">
      AI DISCOVERY PLATFORM
    </text>
  </g>
</svg>
