<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D18" />
      <stop offset="50%" stop-color="#0D1224" />
      <stop offset="100%" stop-color="#080A14" />
    </linearGradient>

    <radialGradient id="mesh-violet" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#635BFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mesh-cyan" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#635BFF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#635BFF" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#mesh-violet)" />
  <rect width="1200" height="630" fill="url(#mesh-cyan)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Logomark Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#11162B" stroke="url(#accent-grad)" stroke-width="2" />
    <!-- Node icon inside -->
    <circle cx="28" cy="16" r="3" fill="#00D4FF" />
    <circle cx="40" cy="28" r="3" fill="#635BFF" />
    <circle cx="28" cy="40" r="3" fill="#EC4899" />
    <circle cx="16" cy="28" r="3" fill="#00D4FF" />
    <path d="M28 16 L28 40 M16 28 L40 28 M20 20 L36 36 M36 20 L20 36" stroke="url(#accent-grad)" stroke-width="1.5" />
    
    <text x="72" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      LLM <tspan fill="#635BFF">For Everyone</tspan>
    </text>
  </g>

  <!-- Tagline Pill -->
  <g transform="translate(80, 165)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#635BFF" stroke-opacity="0.4" />
    <circle cx="16" cy="16" r="4" fill="#635BFF" />
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8F89FF" letter-spacing="1">
      INTERACTIVE AI DISCOVERY
    </text>
  </g>

  <!-- Big Hero Headline -->
  <text x="80" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
    AI workflows designed for
  </text>
  <text x="80" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#accent-grad)" letter-spacing="-1.5">
    students &amp; real professionals.
  </text>

  <!-- Subtitle -->
  <text x="80" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Production-grade prompts, 60s discovery wizard, and domain frameworks.
  </text>

  <!-- 3 Feature Stat Pills at Bottom -->
  <g transform="translate(80, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="280" height="90" rx="18" fill="#111628" stroke="url(#card-border)" stroke-width="1" />
    <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00D4FF">STUDENTS (K-12 TO PhD)</text>
    <text x="24" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#CBD5E1">Engineering, Med, Arts &amp; Law</text>

    <!-- Pill 2 -->
    <rect x="310" y="0" width="280" height="90" rx="18" fill="#111628" stroke="url(#card-border)" stroke-width="1" />
    <text x="334" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#8F89FF">12+ CAREER PATHWAYS</text>
    <text x="334" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#CBD5E1">Doctors, Farmers, Devs, Homemakers</text>

    <!-- Pill 3 -->
    <rect x="620" y="0" width="280" height="90" rx="18" fill="#111628" stroke="url(#card-border)" stroke-width="1" />
    <text x="644" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10B981">100% IN-BROWSER</text>
    <text x="644" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#CBD5E1">Zero Logins · Zero Trackers · Free</text>
  </g>
</svg>
